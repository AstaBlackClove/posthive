packages:
  - "apps/*"

overrides:
  "express@^5.2.1": "^5.3.0"
  "@hono/node-server@^1.19.9": "^2.1.3"
  "@fastify/busboy@^3.0.0": "^3.2.5"
  "postcss@8.5.15": "^8.5.32"
  "source-map-js": "^1.2.2"
  "ip-address@^10.2.0": "^10.7.6"
  "fast-uri@^3.0.1": "^3.1.9"
  "fast-copy@^4.0.0": "^4.1.0"
  "baseline-browser-mapping@^2.9.19": "^2.11.35"
  "body-parser@^2.3.0": "^2.4.0"
  "hono@^4": "^4.13.17"
  # Pinned below latest — 7.3.2 was published too recently to clear Vercel's
  # minimum-release-age supply-chain check at deploy time.
  "fast-json-stringify@^7.0.0": "7.3.1"

# Allow postinstall build scripts for Prisma engines and esbuild.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
